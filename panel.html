<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Speak</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header><h1>Shadow Speak</h1></header>
  <main>
    <section class="setup">
      <section class="cloud" id="cloud">
        <div id="api-setup" hidden>
        <label for="api-key">Supadata API key</label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key here">
        <div class="key-links"><a href="https://dash.supadata.ai/" target="_blank" rel="noreferrer">Get key ↗</a><button id="save-key" type="button">Save key</button><button id="forget-key" type="button">Clear key</button></div>
        <details class="transcript-options"><summary>Options</summary>
        <label class="check"><input id="ai-fallback" type="checkbox"> AI fallback (extra credits)</label>
        </details>
        </div>
        <div class="actions"><button id="cloud-load" class="primary">Get full transcript</button><button id="change-key" class="link-button" aria-controls="api-setup" aria-expanded="false" hidden>Change API key</button><button id="cloud-cancel" hidden>Cancel</button></div>
      </section>
      <div class="settings">
        <div class="speed-control">
          <div class="speed-heading"><label for="rate">Playback speed</label><output id="rate-value" for="rate">1.00×</output></div>
          <input id="rate" type="range" min="0.5" max="1.5" step="0.05" value="1" aria-valuetext="1.00 times">
          <div class="speed-labels" aria-hidden="true"><span>0.5×</span><span>1×</span><span>1.5×</span></div>
        </div>
        <label>Pause boundary<select id="split-mode"><option value="seven">Every 7 seconds</option><option value="pause" selected>By pause</option></select></label>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <audio id="voice-playback" hidden preload="metadata"></audio>
    <div class="section-heading"><h2>Practice phrases</h2></div>
    <div class="microphone-control"><label for="microphone">Microphone<select id="microphone"><option value="">System default</option></select></label><button id="microphone-refresh" type="button">Refresh</button></div>
    <p id="microphone-status" class="hint" role="status"></p>
    <div id="phrases"></div>
  </main>
  <script type="module" src="panel.mjs"></script>
</body>
</html>
